# Explicit project name: compose otherwise names it after the folder ("backend"),
# and any other repo with an apps/backend compose file would share this
# container and its data volume.
name: quacker

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: quacker
      POSTGRES_PASSWORD: quacker
      POSTGRES_DB: quacker
    ports:
      - 5433:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quacker -d quacker']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
